name: Free source security checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install the official Gitleaks release and verify its checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/source-scanners
          gh release download v8.30.1 --repo gitleaks/gitleaks --pattern '*linux_x64.tar.gz' --pattern '*checksums.txt' --dir /tmp/source-scanners
          cd /tmp/source-scanners
          sha256sum --check --ignore-missing gitleaks_8.30.1_checksums.txt
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
      - name: Scan repository history without printing secrets
        run: /tmp/source-scanners/gitleaks git --redact=100 --no-banner --log-opts="--all"
      - name: Scan source locally with the open-source engine
        run: |
          python -m pip install semgrep==1.182.1
          semgrep scan --config .security/semgrep.yml --metrics off --disable-version-check --error
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - name: Request security regression checks
        run: npm run test:request-security
